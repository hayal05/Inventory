name: Complete generated inventory artifacts
on:
  push:
    paths:
      - .github/workflows/complete-import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dependency lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --prefix client
          npm install --package-lock-only --ignore-scripts --prefix server
      - name: Generate application icons
        run: |
          python -m pip install pillow
          python client/scripts/make-icons.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json server/package-lock.json client/public/icons/
          if ! git diff --cached --quiet; then
            git commit -m "Import generated application icons and dependency lockfiles"
            git push
          fi
