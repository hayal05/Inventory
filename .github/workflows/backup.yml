# Weekly database backup (task 68).
# Dumps the Neon database and keeps the file as a workflow artifact for 30 days.
#
# Setup (once, in GitHub: Settings > Secrets and variables > Actions):
#   Secret   BACKUP_DATABASE_URL  Neon DIRECT connection string (not the -pooler one),
#                                 ending in ?sslmode=require
#   Variable PG_VERSION           (optional) Postgres major version of your Neon project,
#                                 default 17. pg_dump must be the same version or newer.
#
# The artifact contains all customer data. Keep this repository PRIVATE.
name: weekly-db-backup

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the secret is set
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "::error::Secret BACKUP_DATABASE_URL is not set (see the comments at the top of this file)."
            exit 1
          fi

      - name: Install a matching pg_dump
        env:
          PG_VERSION: ${{ vars.PG_VERSION || '17' }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_VERSION}"
          echo "/usr/lib/postgresql/${PG_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Dump the database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          pg_dump --version
          # Custom format (-Fc): compressed, restorable with pg_restore.
          # --no-owner/--no-privileges so it restores into any database or role.
          pg_dump "$BACKUP_DATABASE_URL" -Fc --no-owner --no-privileges -f "backup-$(date -u +%F).dump"

      - name: Check the dump is readable
        run: |
          f=$(ls backup-*.dump)
          ls -l "$f"
          # Fails if the file is not a valid archive; also confirm our tables are in it.
          pg_restore --list "$f" > contents.txt
          for t in orgs users locations products batches stock_movements; do
            grep -q "TABLE public $t " contents.txt || { echo "::error::table $t missing from the dump"; exit 1; }
          done
          echo "Dump contains all 6 tables."

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.dump
          retention-days: 30
          if-no-files-found: error
