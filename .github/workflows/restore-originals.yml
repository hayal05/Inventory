name: Restore exact Inventory metadata
on:
  push:
    paths:
      - .import/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompress imported original project files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, lzma
          for p in Path(".import").rglob("*"):
              if not p.is_file() or p.suffix not in (".gz", ".xz"): continue
              target = Path(str(p)[len(".import/"):-len(p.suffix)])
              target.parent.mkdir(parents=True, exist_ok=True)
              decoder = gzip.decompress if p.suffix == ".gz" else lzma.decompress
              target.write_bytes(decoder(p.read_bytes()))
              print("Restored", target)
          PY
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Restore original Inventory project files"
            git push
          fi
